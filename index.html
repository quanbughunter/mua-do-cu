/* Bố cục: một cột hẹp như tờ phiếu kiểm trên bìa kẹp hồ sơ. Thanh trên cùng dính đầu trang (tên máy + các bước),
   thanh "phiếu" dính đáy luôn hiện điểm, giá hợp lý và con dấu kết luận. */
:root {
  --bg: #EEF1F5;
  --surface: #FFFFFF;
  --sunk: #E4E8EF;
  --ink: #141A26;
  --muted: #586174;
  --line: #D3D9E3;
  --accent: #2D46C8;
  --accent-ink: #FFFFFF;
  --accent-soft: #E2E7FB;
  --pass: #11744A;
  --pass-soft: #DCF1E6;
  --warn: #9A5500;
  --warn-soft: #FAEAD2;
  --stop: #BE2530;
  --stop-soft: #F8DDDF;
  --info: #3A5A8C;
  --info-soft: #E1E9F4;
  --shadow: 0 1px 0 rgba(20, 26, 38, .04), 0 6px 18px -10px rgba(20, 26, 38, .25);
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  --f-body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --r: 12px;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E121A; --surface: #161C27; --sunk: #1D2431; --ink: #E6EAF2; --muted: #9BA5B7; --line: #2A3243;
    --accent: #93A4FF; --accent-ink: #0E121A; --accent-soft: #222B4C;
    --pass: #5ACF8E; --pass-soft: #15301F; --warn: #F1AA4E; --warn-soft: #3A2A13;
    --stop: #FF7D80; --stop-soft: #3E1A1D; --info: #93B3E8; --info-soft: #1A2538;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 22px -12px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E121A; --surface: #161C27; --sunk: #1D2431; --ink: #E6EAF2; --muted: #9BA5B7; --line: #2A3243;
  --accent: #93A4FF; --accent-ink: #0E121A; --accent-soft: #222B4C;
  --pass: #5ACF8E; --pass-soft: #15301F; --warn: #F1AA4E; --warn-soft: #3A2A13;
  --stop: #FF7D80; --stop-soft: #3E1A1D; --info: #93B3E8; --info-soft: #1A2538;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 22px -12px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--f-body);
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.ico { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ico.sm { width: 18px; height: 18px; }

.wrap { max-width: 680px; margin: 0 auto; padding-left: var(--gut-l); padding-right: var(--gut-r); }

/* ---------- Thanh trên ---------- */
.appbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.appbar .row { display: flex; align-items: center; gap: 8px; min-height: 54px; }
.appbar .ttl { flex: 1; min-width: 0; }
.appbar h1 { font: 700 21px/1.1 var(--f-display); letter-spacing: .01em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appbar .sub { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn {
  display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 10px;
  border: 0; background: transparent; color: var(--ink);
}
.iconbtn:hover { background: var(--sunk); }

.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding-bottom: 8px; }
.tab {
  border: 0; background: transparent; padding: 6px 2px 5px; border-radius: 8px; min-width: 0;
  font-weight: 600; font-size: 13.5px; line-height: 1.2; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative;
}
.tab .lb { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tab .cnt { font: 500 11px/1.2 var(--f-mono); color: var(--muted); }
.tab .cnt.none { visibility: hidden; }
.tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
.tab[aria-selected="true"] .cnt { color: var(--accent); }
.tab .dot { position: absolute; top: 5px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--stop); }

main { padding-block: 16px 132px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.sect-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 10px 0 2px; }
.sect-h h2 { font: 700 15px/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.sect-h .prog { font: 500 12px var(--f-mono); color: var(--muted); }

/* ---------- Trang đầu ---------- */
.hero { padding-block: 8px 4px; }
.brand { font: 700 40px/0.95 var(--f-display); text-transform: uppercase; letter-spacing: .01em; }
.brand em { font-style: normal; color: var(--accent); }
.lede { margin: 8px 0 0; color: var(--muted); max-width: 46ch; }
.cats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.cat {
  display: flex; flex-direction: column; align-items: flex-start; gap: 10px; text-align: left;
  padding: 14px 12px 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow);
}
.cat .ico { width: 30px; height: 30px; color: var(--accent); stroke-width: 1.6; }
.cat b { font: 700 19px/1 var(--f-display); text-transform: uppercase; }
.cat span { font-size: 12px; color: var(--muted); line-height: 1.35; }
.cat:hover { border-color: var(--accent); }

.slip {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center;
  padding: 12px 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); text-align: left; width: 100%;
}
.slip .nm { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slip .meta { font-size: 12.5px; color: var(--muted); grid-column: 1; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.slip .right { grid-row: 1 / span 2; grid-column: 2; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.slip .score { font: 700 26px/1 var(--f-display); }
.slip .score small { font-size: 13px; color: var(--muted); font-weight: 600; }
.tag-ex { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--info); background: var(--info-soft); padding: 1px 6px; border-radius: 4px; }
.empty { padding: 18px; border: 1px dashed var(--line); border-radius: var(--r); color: var(--muted); text-align: center; }

/* ---------- Ô nhập ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
.inp, select.inp, textarea.inp {
  width: 100%; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
  font-size: 16px; line-height: 1.35;
}
textarea.inp { resize: vertical; min-height: 92px; }
.inp:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.inp.mono { font-family: var(--f-mono); letter-spacing: .02em; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 420px) { .grid2.tight { grid-template-columns: 1fr; } }
.hint { font-size: 12.5px; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.panel h3 { font: 700 16px/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .06em; }
.decode { border-radius: 10px; padding: 10px 12px; font-size: 13.5px; display: flex; flex-direction: column; gap: 3px; }
.decode b { font-weight: 600; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.chiplink { font-size: 13px; font-weight: 600; text-decoration: none; padding: 6px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.chiplink:hover { border-color: var(--accent); color: var(--accent); }

.tone-pass { background: var(--pass-soft); color: var(--pass); }
.tone-warn { background: var(--warn-soft); color: var(--warn); }
.tone-stop { background: var(--stop-soft); color: var(--stop); }
.tone-info { background: var(--info-soft); color: var(--info); }
.note { border-radius: 10px; padding: 9px 12px; font-size: 13.5px; }
.note b { font-weight: 600; }

/* ---------- Mục kiểm tra ---------- */
.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; }

.path { font: 500 12px/1.5 var(--f-mono); color: var(--info); background: var(--info-soft); padding: 4px 8px; border-radius: 6px; align-self: flex-start; max-width: 100%; overflow-wrap: anywhere; }
.how { font-size: 14px; margin: 0; }
.pass { font-size: 13.5px; color: var(--muted); margin: 0; }
.pass b { color: var(--pass); font-weight: 600; }
.levels { display: flex; flex-wrap: wrap; gap: 6px; }
.lv {
  border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px;
  font-size: 13.5px; font-weight: 500; line-height: 1.3; text-align: left;
}
.lv:hover { border-color: var(--muted); }
.lv[aria-pressed="true"].t-pass { background: var(--pass); border-color: var(--pass); color: var(--surface); }
.lv[aria-pressed="true"].t-warn { background: var(--warn); border-color: var(--warn); color: var(--surface); }
.lv[aria-pressed="true"].t-stop { background: var(--stop); border-color: var(--stop); color: var(--surface); }
.lvnote { font-size: 13px; }
.item-f { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
.linkbtn { border: 0; background: none; padding: 2px 0; font-size: 13px; font-weight: 600; color: var(--accent); display: inline-flex; align-items: center; gap: 5px; }
.linkbtn.muted { color: var(--muted); }
.toolbtn { border: 1px solid var(--accent); color: var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.inrow { display: flex; gap: 10px; flex-wrap: wrap; }

.unit { position: relative; }

.ko-banner { border-radius: var(--r); padding: 12px 14px; background: var(--stop); color: var(--surface); display: flex; flex-direction: column; gap: 4px; }
.ko-banner b { font: 700 20px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .04em; }

.verdict { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; }
.stamp {

}
.stamp.sm { font-size: 15px; padding: 5px 8px 3px; border-width: 2px; box-shadow: none; transform: rotate(-3deg); }
.c-pass { color: var(--pass); } .c-warn { color: var(--warn); } .c-stop { color: var(--stop); } .c-info { color: var(--info); }
.verdict p { margin: 0; }

.bignum { font: 700 64px/0.9 var(--f-display); letter-spacing: -.01em; }
.bignum small { font-size: 22px; color: var(--muted); }
.grade { font: 700 20px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .04em; }
.bar { height: 8px; border-radius: 99px; background: var(--sunk); overflow: hidden; }

function ratedShutter(m) {
  if (!m) return { n: SHUTTER_TIER.mid, src: 'ước tính' };

  return { n: SHUTTER_TIER[m.tier || 'mid'], src: 'ước tính' };

// ===== Quy ra tiền: chi phí sửa từng bộ phận và luật trừ tiền cho từng mục =====
// Giá hợp lý = Giá tham chiếu × Hệ số ngoại hình − Σ chi phí sửa lỗi đã thấy − Σ rủi ro mục chưa kiểm.
// Chi phí sửa tính bằng USD theo bảng giá hãng, nhân "hệ số giá tiệm" trong Cài đặt rồi đổi ra tiền đang dùng.
// Người dùng sửa được từng khoản ngay trên màn hình kết quả, vì giá sửa mỗi nơi một khác.

const R = Math.round;

// Bảng giá sửa ngoài bảo hành của Apple ở Mỹ (màn 129–379, pin 89–129, kính lưng 169–199 USD).
// Face ID: theo mức trừ của 24hStore (3–6 triệu ₫). Các mục khác là ước lượng, sửa được.
function phoneRepairUSD(m) {
  const n = (m && m.name) || '';
  const y = (m && m.year) || 2023;
  if (m && m.brand === 'apple') {
    const usd = m.usd || 999;
    const pm = /Pro Max/.test(n), plus = /Plus|Air/.test(n), pro = /Pro/.test(n), mini = /mini/.test(n), se = /SE/.test(n);
    const screen = se ? 129 : mini ? 229 : pm ? (y >= 2022 ? 379 : 329) : plus ? 329 : pro ? (y >= 2022 ? 329 : 279)
      : n === 'iPhone 11' ? 199 : /16e|17e/.test(n) ? 229 : 279;
    const battery = se ? 89 : y >= 2026 ? 129 : y >= 2024 ? 119 : 99;
    const glassBack = y >= 2023 || (y === 2022 && !pro);
    return {
      screen, battery,
      back: glassBack ? (pm || plus ? 199 : 169) : (pm ? 599 : pro ? 549 : 449),
      rearcam: R(usd * 0.18), frontcam: R(usd * 0.08),
      bio: m.touchId ? 90 : y <= 2019 ? 120 : y <= 2021 ? 190 : 230,
      port: 79, speaker: 59, mic: 59, buttons: 59, vibrate: 49, sensors: 59, camglass: 39, board: R(usd * 0.35)
    };
  }
  const usd = (m && m.usd) || 500;
  return {
    screen: R(usd * 0.22), battery: 69, back: R(usd * 0.08) + 20, rearcam: R(usd * 0.14), frontcam: R(usd * 0.06),
    bio: R(usd * 0.07), port: 49, speaker: 45, mic: 45, buttons: 45, vibrate: 39, sensors: 45, camglass: 29, board: R(usd * 0.35)
  };
}

// AirPods: giá thay một tai / hộp sạc của Apple (69–99 USD); Max: pin 79, đệm tai 69. Hãng khác: ước lượng theo giá bán.
function headphoneRepairUSD(m) {
  const over = m && m.form === 'over';
  const usd = (m && m.usd) || (over ? 300 : 150);
  if (m && m.brand === 'apple' && !over) {
    const pro = /Pro/.test(m.name);
    const bud = /Pro 3/.test(m.name) ? 99 : pro ? 89 : 69;
    return { bud, batt: bud * 2, case: pro ? 99 : 69, tips: 8, clean: 10, hinge: 0, cushion: 0 };
  }
  if (m && m.max) return { bud: R(usd * 0.35), batt: 79, case: 0, tips: 0, clean: 10, hinge: R(usd * 0.25), cushion: 69 };
  if (over) return { bud: R(usd * 0.35), batt: 50, case: 0, tips: 0, clean: 10, hinge: 45, cushion: 30 };
  return { bud: R(usd * 0.4), batt: R(usd * 0.6), case: R(usd * 0.35), tips: 10, clean: 10, hinge: 0, cushion: 0 };
}

// Máy ảnh: thay màn trập 150–400 USD (Swappa, PhotoWorkout), vệ sinh cảm biến < 100 USD (SlashGear).
function cameraRepairUSD(m) {
  const usd = (m && m.usd) || 1200;
  const tier = (m && (m.tier || (m.rated && m.rated.n >= 200000 ? 'ff' : 'mid'))) || 'mid';
  return {
    shutter: { entry: 160, mid: 220, ff: 300, pro: 380 }[tier] || 220,
    clean: 60, sensor: R(usd * 0.45), af: R(usd * 0.3), ibis: R(usd * 0.2) + 50, lcd: 130, evf: 170,
    buttons: 70, slot: 120, ports: 80, battery: 50, mount: 90, grip: 35, water: R(usd * 0.3), board: R(usd * 0.35)
  };
}

function decodeApplePartNo(raw) {
  const s = String(raw || '').toUpperCase().replace(/\s+/g, '');
  if (!s) return null;
  const m = s.match(/^([0-9]{1,3}|[A-Z])([A-Z0-9]{4})([A-Z]{1,2})(\/[A-Z])?$/);
  if (!m) return { ok: false, msg: 'Không đúng dạng số máy Apple (vd. MFYN4ZA/A). Xem ở Cài đặt › Cài đặt chung › Giới thiệu › Số máy.' };
  const src = APPLE_SOURCE[m[1]] || { text: 'Mã nguồn gốc lạ (' + m[1] + ')', tone: 'warn' };
  return {
    ok: true, first: m[1], config: m[2], region: m[3],
    source: src,
    regionLegacy: REGION_LEGACY[m[3]] || null,
    regionModern: REGION_MODERN[m[3]] || null
  };
}

// Máy này có khay SIM không? 'none' = chỉ eSIM, 'tray' = có khay, null = không xác định.
function simExpectation(model, part) {
  if (!model || model.brand !== 'apple') return null;
  if (model.esim === 'all') return 'none';
  if (!model.esim) return model.year && model.year <= 2021 ? 'tray' : (model.year && model.year < 2026 ? 'tray' : null);
  if (!part || !part.ok) return null;
  return ESIM_ONLY[model.esim].indexOf(part.region) >= 0 ? 'none' : 'tray';
}

function mkCode(o) { return Object.assign({ ok: true, rows: [], notes: [], model: null, grp: null }, o); }

function decodeOneCode(token) {
  const s = String(token || '').trim().toUpperCase().replace(/[‐-―]/g, '-');
  if (!s) return null;

  // Samsung: dòng SAOMC trong Mã nhà cung cấp dịch vụ, vd. SAOMC_SM-S928B_OXM_SKZ_16_0005
  let m = s.match(/^SAOMC_SM-?([A-Z]\d{3})([A-Z0-9]{0,3})_([A-Z]{3})_([A-Z]{3})/);
  if (m) return samsungCscResult(s, [m[4], m[3]], m[1], m[2]);

  // Samsung: Phiên bản CSC, vd. S928BOXM6DZI1, S918U1OYM2AWB1
  m = s.match(/^([A-Z]\d{3})(U1|[A-Z]|0)?([A-Z]{3})(\d[A-Z0-9]{4,5})$/);
  if (m && (SS_CSC[m[3]] || /^O[A-Z]{2}$/.test(m[3]))) return samsungCscResult(s, [m[3]], m[1], m[2] || '');
  if (m && SS_MODELS[m[1]]) {
    return mkCode({ brand: 'samsung', what: 'Phiên bản phần mềm Samsung', code: s, model: SS_MODELS[m[1]], ssBase: m[1],
      market: { text: 'Không đọc được nước từ dòng này', tone: 'info' },
      rows: [['Đời máy', SS_MODELS[m[1]]]],
      notes: [{ tone: 'info', text: 'Đây là phiên bản phần mềm (PDA). Mã nước nằm ở dòng Phiên bản CSC hoặc Mã nhà cung cấp dịch vụ, cùng màn Thông tin phần mềm.' }] });
  }

  // Samsung: mã nhà mạng Nhật (docomo SC-xxX, au SCGxx)
  if (/^(SC-\d{2}[A-Z]|SCG\d{2}|SCV\d{2})$/.test(s)) {
    return mkCode({ brand: 'samsung', what: 'Mã máy Samsung bán qua nhà mạng Nhật', code: s, grp: 'jp',
      market: { text: 'Nhật Bản, máy nhà mạng', tone: 'warn' },
      notes: [{ tone: 'warn', text: 'Máy nhà mạng Nhật: dễ bị khoá mạng, thiếu băng tần dùng ở Việt Nam và Nga, tiếng chụp ảnh luôn kêu.' }] });
  }

  // Samsung: số model, vd. SM-S928B/DS, SM-S928N, SM-S928U1, SM-S9280
  m = s.match(/^(SM-?)?([A-Z])(\d{3})([A-Z0-9]{0,3}?)(\/DS)?$/);
  if (m && (m[1] || SS_MODELS[m[2] + m[3]]) && (m[1] || m[4])) {
    const base = m[2] + m[3];
    let suf = m[4];
    let dual = !!m[5];
    if (!SS_SUFFIX[suf] && suf.length === 2 && suf[1] === 'D' && SS_SUFFIX[suf[0]]) { suf = suf[0]; dual = true; }
    const sx = SS_SUFFIX[suf] || null;
    const name = SS_MODELS[base] || null;
    const r = mkCode({ brand: 'samsung', what: 'Số model Samsung', code: 'SM-' + base + m[4] + (m[5] || ''), model: name, ssBase: base, grp: sx ? sx.grp : null,
      market: sx ? { text: sx.text, tone: sx.tone } : { text: suf ? 'Hậu tố "' + suf + '" chưa có trong bảng' : 'Thiếu hậu tố vùng (chữ sau 3 số)', tone: 'info' } });
    r.rows.push(['Đời máy', name || base + ' (chưa có trong bảng đời máy)']);
    if (suf) r.rows.push(['Hậu tố', suf + (sx ? ' · ' + sx.text : '')]);
    if (dual) r.rows.push(['SIM', '/DS: 2 SIM']);
    if (sx && sx.note) r.notes.push({ tone: sx.tone === 'warn' ? 'warn' : 'info', text: sx.note });
    return r;
  }

  // Samsung: mã CSC đứng riêng, vd. SER, SKZ/SKZ/SKZ, SKZ/SKZ/SKZ,SKZ/SKZ
  if (/^[A-Z]{3}([\/,][A-Z]{3})*$/.test(s)) {
    const codes = s.split(/[\/,]/);
    if (codes.some(x => SS_CSC[x])) return samsungCscResult(s, codes, null, null);
  }

  // Apple: số máy, vd. MGCM3LL/A
  if (/^([0-9]{1,3}|[A-Z])[A-Z0-9]{4}[A-Z]{1,2}\/[A-Z]$/.test(s) || /^[MFNPG][A-Z0-9]{4}[A-Z]{1,2}$/.test(s)) {
    const p = decodeApplePartNo(s);
    if (p && p.ok) {
      const head = p.regionLegacy || p.regionModern;
      const ru = APPLE_RU.indexOf(p.region) >= 0;
      const r = mkCode({ brand: 'apple', what: 'Số máy Apple', code: s, grp: p.region === 'CH' ? 'cn' : p.region === 'LL' ? 'us' : p.region === 'J' ? 'jp' : p.region === 'KH' ? 'kr' : 'intl',

      if (p.source.tone !== 'pass') r.notes.push({ tone: p.source.tone === 'warn' ? 'warn' : 'info', text: 'Số máy bắt đầu bằng "' + p.first + '": ' + p.source.text + '.' + (p.source.note ? ' ' + p.source.note : '') });
      const n = APPLE_MARKET_NOTES[p.region] || (ru ? 'Máy bán chính hãng tại Nga.' : '');
      if (n) r.notes.push({ tone: 'info', text: n });
      return r;
    }
  }
  if (/^A\d{4}$/.test(s)) {
    return mkCode({ brand: 'apple', what: 'Mã kiểu máy Apple', code: s, market: { text: 'Mã A chỉ cho biết đời máy, không rõ nước', tone: 'info' },
      notes: [{ tone: 'info', text: 'Trong Cài đặt › Cài đặt chung › Giới thiệu, bấm vào dòng Số máy để đổi sang dạng có dấu gạch chéo (vd. MGCM3LL/A) rồi nhập lại.' }] });
  }

  // Xiaomi: phiên bản HyperOS / MIUI, vd. OS2.0.3.0.VNFMIXM, 3.0.305.0.WMLTWXM, V14.0.4.0.TKIJPXM
  m = s.match(/^(OS|V)?(\d{1,2})\.(\d+)\.(\d+)\.(\d+)\.([A-Z])([A-Z]{2})([A-Z]{2})XM([A-Z]*)$/);
  if (m) {
    const rom = XM_ROM[m[8]];
    const major = +m[2];
    const r = mkCode({ brand: 'xiaomi', what: 'Phiên bản phần mềm Xiaomi', code: s, grp: rom ? rom[2] : null, romRegion: m[8],
      market: rom ? { text: rom[0], tone: rom[1] } : { text: 'Mã vùng ROM "' + m[8] + '" chưa có trong bảng', tone: 'info' } });

    r.rows.push(['Mã vùng ROM', m[8] + 'XM' + (rom ? ' · ' + rom[0] : '')]);
    if (m[8] === 'CN') r.notes.push({ tone: 'warn', text: 'ROM Trung Quốc: không có sẵn dịch vụ Google, thông báo ứng dụng dễ đến chậm, một số ứng dụng Việt hoặc ngân hàng có thể chạy không ổn định.' });
    if (m[9]) r.notes.push({ tone: 'info', text: 'Đuôi "' + m[9] + '" sau XM thường là bản cho một nhà mạng.' });
    return r;

  // Xiaomi / Redmi / POCO: kiểu máy, vd. 2312DRA50G, 24040RN64Y
  m = s.match(/^(\d{2})(\d{2})[0-9A-Z]{3,7}$/);
  if (m && /[A-Z]$/.test(s) && /[A-Z]/.test(s.slice(4, -1)) && +m[2] >= 1 && +m[2] <= 12) {
    const L = s.slice(-1), sx = XM_SUFFIX[L];
    const r = mkCode({ brand: 'xiaomi', what: 'Kiểu máy Xiaomi / Redmi / POCO', code: s, grp: sx ? sx.grp : null,
      market: sx ? { text: sx.text, tone: sx.tone } : { text: 'Chữ cuối "' + L + '" chưa có trong bảng', tone: 'info' } });
    r.rows.push(['Chữ cuối', L + (sx ? ' · ' + sx.text : '')]);
    r.rows.push(['Đăng ký mẫu', 'khoảng tháng ' + (+m[2]) + '/20' + m[1]]);
    if (sx && sx.note) r.notes.push({ tone: sx.tone === 'warn' ? 'warn' : 'info', text: sx.note });
    return r;
  }

  // Oppo / OnePlus: CPH = quốc tế, P + 2 chữ + 3 số = Trung Quốc; Realme: RMX
  if (/^CPH\d{4}$/.test(s)) {
    return mkCode({ brand: 'oppo', what: 'Kiểu máy Oppo / OnePlus', code: s, grp: 'intl', market: { text: 'Quốc tế', tone: 'pass' },
      notes: [{ tone: 'info', text: 'Mã CPH là bản bán ngoài Trung Quốc, có sẵn dịch vụ Google.' }] });
  }
  if (/^P[A-Z]{2}\d{3}$/.test(s)) {
    return mkCode({ brand: 'oppo', what: 'Kiểu máy Oppo / OnePlus', code: s, grp: 'cn', market: { text: 'Trung Quốc', tone: 'warn' },
      notes: [{ tone: 'warn', text: 'Bản Trung Quốc: ColorOS bản nội địa, thường thiếu dịch vụ Google và ít ngôn ngữ. Hãng không bảo hành ngoài Trung Quốc.' }] });
  }
  if (/^RMX\d{4}$/.test(s)) {
    return mkCode({ brand: 'oppo', what: 'Kiểu máy Realme', code: s, market: { text: 'Không đọc được nước từ mã RMX', tone: 'info' },
      notes: [{ tone: 'info', text: 'Realme dùng mã RMX cho mọi thị trường. Xem ngôn ngữ, dịch vụ Google và phiên bản realme UI để đoán.' }] });
  }

  // vivo: V + 4 số, đuôi A thường là bản Trung Quốc
  m = s.match(/^V(\d{4})([A-Z]?)$/);
  if (m) {
    const cn = m[2] === 'A';
    return mkCode({ brand: 'vivo', what: 'Kiểu máy vivo', code: s, grp: cn ? 'cn' : 'intl',
      market: { text: cn ? 'Thường là bản Trung Quốc' : 'Thường là bản quốc tế', tone: cn ? 'warn' : 'info' },
      notes: [{ tone: 'info', text: 'Quy ước của vivo: mã có đuôi A thường là máy bán ở Trung Quốc, không đuôi là bản quốc tế. Đối chiếu thêm ngôn ngữ và dịch vụ Google.' }] });
  }

  // Honor / Huawei: 3 chữ - đuôi, vd. DNP-AN00 (TQ), DNP-NX9 (quốc tế), ELE-L29
  m = s.match(/^([A-Z]{3})-([A-Z]{1,2})(\d{1,2})$/);
  if (m) {
    const cn = HONOR_CN.indexOf(m[2]) >= 0, intl = HONOR_INTL.indexOf(m[2]) >= 0;
    const r = mkCode({ brand: 'honor', what: 'Kiểu máy Honor / Huawei', code: s, grp: cn ? 'cn' : intl ? 'intl' : null,
      market: cn ? { text: 'Trung Quốc', tone: 'warn' } : intl ? { text: 'Quốc tế', tone: 'pass' } : { text: 'Đuôi "' + m[2] + m[3] + '" chưa có trong bảng', tone: 'info' } });
    if (cn) r.notes.push({ tone: 'warn', text: 'Đuôi ' + m[2] + m[3] + ' là bản Trung Quốc: phần mềm nội địa, thiếu dịch vụ Google, không bảo hành ngoài Trung Quốc.' });
    if (intl) r.notes.push({ tone: 'info', text: 'Bản quốc tế. Riêng Huawei đời mới thì bản quốc tế cũng không có dịch vụ Google; Honor quốc tế thì có.' });
    return r;
  }

  // IMEI: không cho biết nước bán, nhưng kiểm tra được chữ số cuối
  if (/^\d{15,16}$/.test(s)) {
    const im = checkIMEI(s);
    return mkCode({ brand: null, what: 'IMEI', code: s, market: { text: 'IMEI không cho biết máy bán ở nước nào', tone: 'info' },
      rows: [['TAC', im.tac], ['Kiểm tra', im.ok ? (im.sv ? 'IMEISV 16 số' : 'Đúng thuật toán Luhn') : 'Sai chữ số cuối']],
      notes: [{ tone: im.ok ? 'info' : 'stop', text: im.msg }] });
  }

  return { ok: false, code: s, msg: 'Chưa nhận ra mã "' + s + '".' };
}

function samsungCscResult(raw, codes, base, suf) {
  const uniq = codes.filter((x, i) => codes.indexOf(x) === i);
  const known = uniq.filter(x => SS_CSC[x]);
  const main = SS_CSC[uniq[0]] || (known.length ? SS_CSC[known[0]] : null);
  const r = mkCode({ brand: 'samsung', what: base ? 'Phần mềm Samsung (CSC)' : 'Mã CSC Samsung', code: raw, grp: main ? main[1] : null,
    market: main ? { text: main[0], tone: main[1] === 'intl' ? 'pass' : 'info' } : { text: 'Mã CSC chưa có trong bảng', tone: 'info' } });
  if (base) {
    r.ssBase = base; r.model = SS_MODELS[base] || null;
    r.rows.push(['Đời máy', (SS_MODELS[base] || base) + (suf ? ' · hậu tố ' + suf : '')]);
    const sx = SS_SUFFIX[suf];
    if (sx) r.suffixGrp = sx.grp;
  }
  uniq.forEach(x => r.rows.push(['CSC ' + x, SS_CSC[x] ? SS_CSC[x][0] : (/^O[A-Z]{2}$/.test(x) ? 'nhóm phần mềm nhiều nước' : 'chưa có trong bảng')]));
  if (/^O[A-Z]{2}$/.test(uniq[0]) && uniq.length === 1) r.notes.push({ tone: 'info', text: 'Mã bắt đầu bằng O là nhóm phần mềm dùng cho nhiều nước. Nước cụ thể là mã 3 chữ ở dòng Mã nhà cung cấp dịch vụ (vd. SER/SER/SER).' });
  if (r.suffixGrp && main && r.suffixGrp !== main[1] && [r.suffixGrp, main[1]].some(g => g !== 'intl')) {
    r.notes.push({ tone: 'warn', text: 'Hậu tố model (' + SS_GRP_NAME[r.suffixGrp] + ') và phần mềm (' + SS_GRP_NAME[main[1]] + ') không cùng vùng: máy có thể đã bị cài lại phần mềm khác nước.' });
  }
  return r;
}

// Nhiều mã cách nhau bằng dấu cách / xuống dòng. Trả về từng mã và các cảnh báo khi so chéo.
function decodeCodes(raw) {
  const toks = String(raw || '').split(/[\s;]+/).map(t => t.replace(/^[,.:]+|[,.:]+$/g, '')).filter(t => t.length >= 3 && (/\d/.test(t) || /^[A-Za-z]{3}([\/,][A-Za-z]{3})*$/.test(t)));
  const items = toks.slice(0, 6).map(decodeOneCode).filter(x => x && (x.ok || /\d/.test(x.code)));
  const cross = [];
  const ok = items.filter(x => x.ok);
  const ssModel = ok.find(x => x.brand === 'samsung' && x.what === 'Số model Samsung' && x.grp);
  const ssSoft = ok.find(x => x.brand === 'samsung' && x.what !== 'Số model Samsung' && x.grp);
  if (ssModel && ssSoft && ssModel.grp !== ssSoft.grp && [ssModel.grp, ssSoft.grp].some(g => g !== 'intl')) {
    cross.push({ tone: 'warn', text: 'Số model là bản ' + SS_GRP_NAME[ssModel.grp] + ' nhưng phần mềm là bản ' + SS_GRP_NAME[ssSoft.grp] + ': máy có thể đã bị cài lại phần mềm khác nước.' });
  }
  if (ssModel && ssSoft && ssModel.ssBase && ssSoft.ssBase && ssModel.ssBase !== ssSoft.ssBase) {
    cross.push({ tone: 'warn', text: 'Số model (' + ssModel.ssBase + ') và phần mềm (' + ssSoft.ssBase + ') thuộc hai đời máy khác nhau.' });
  }
  const xmModel = ok.find(x => x.brand === 'xiaomi' && x.what.indexOf('Kiểu máy') === 0);
  const xmRom = ok.find(x => x.brand === 'xiaomi' && x.romRegion);
  if (xmModel && xmRom && xmModel.grp === 'cn' && xmRom.romRegion !== 'CN') {
    cross.push({ tone: 'warn', text: 'Máy bản Trung Quốc nhưng chạy ' + (XM_ROM[xmRom.romRegion] ? XM_ROM[xmRom.romRegion][0] : 'ROM ' + xmRom.romRegion) + ': máy đã bị mở khoá và cài lại ROM, thường là ROM sửa. Rủi ro: cập nhật lỗi, ứng dụng ngân hàng có thể từ chối máy đã mở khoá.' });
  } else if (xmModel && xmRom && xmModel.grp === 'intl' && xmRom.romRegion === 'CN') {
    cross.push({ tone: 'warn', text: 'Máy bản quốc tế nhưng chạy ROM Trung Quốc: phần mềm đã bị cài lại.' });
  }
  return { items, cross };
}

// Đối chiếu mã đã giải với đời máy đang chọn trong phiếu.
function codeModelMismatch(model, res) {
  if (!model || !res) return null;
  const items = (res.items || []).filter(x => x.ok);
  if (model.brand === 'samsung' && model.sm) {
    const hit = items.find(x => x.ssBase && x.ssBase !== model.sm);
    if (hit) return 'Mã ' + hit.ssBase + (hit.model ? ' (' + hit.model + ')' : '') + ' không phải ' + model.name + ' (' + model.sm + ').';
  }
  const other = items.find(x => x.brand && x.brand !== model.brand && !(model.brand === 'other' && ['oppo', 'vivo', 'honor'].indexOf(x.brand) >= 0));
  if (other) return 'Mã vừa nhập là của ' + CODE_BRAND_NAMES[other.brand] + ', không khớp máy đang chọn (' + model.name + ').';
  return null;
}

// ---------- IMEI ----------
function luhnCheckDigit(body14) {
  let sum = 0;
  for (let i = 0; i < 14; i++) {
    let d = body14.charCodeAt(i) - 48;
    if (i % 2 === 1) { d *= 2; if (d > 9) d -= 9; }
    sum += d;
  }
  return (10 - (sum % 10)) % 10;
}

function checkIMEI(raw) {
  const d = String(raw || '').replace(/\D/g, '');
  if (!d) return null;
  if (d.length === 16) return { ok: true, sv: true, digits: d, tac: d.slice(0, 8), msg: 'Đây là IMEISV (16 số), không có chữ số kiểm tra. Bấm *#06# để xem IMEI 15 số.' };
  if (d.length !== 15) return { ok: false, digits: d, msg: 'IMEI phải có 15 số (đang có ' + d.length + ').' };
  const exp = luhnCheckDigit(d.slice(0, 14));
  const got = d.charCodeAt(14) - 48;
  return exp === got
    ? { ok: true, digits: d, tac: d.slice(0, 8), msg: 'Hợp lệ. Mã TAC ' + d.slice(0, 8) + ' xác định model.' }
    : { ok: false, digits: d, tac: d.slice(0, 8), msg: 'Sai chữ số kiểm tra (đúng ra là ' + exp + '). Gõ nhầm hoặc IMEI bị sửa.' };
}

// ---------- Số model AirPods ----------
function airpodsLookup(num) {
  const n = String(num || '').toUpperCase().replace(/\s+/g, '');
  if (!n) return null;
  const hits = [];
  HEADPHONE_MODELS.forEach(m => {
    if (m.nums && m.nums.indexOf(n) >= 0) hits.push({ model: m, part: 'tai' });
    if (m.cases && m.cases.indexOf(n) >= 0) hits.push({ model: m, part: 'hộp' });
  });
  return hits;
}

function checkAirpodsSet(left, right, caseNo) {
  const parts = [['Tai trái', left], ['Tai phải', right], ['Hộp sạc', caseNo]].filter(p => p[1]);
  if (!parts.length) return null;
  const rows = parts.map(([label, v]) => {
    const hits = airpodsLookup(v) || [];
    return { label, value: String(v).toUpperCase(), names: hits.map(h => h.model.name + ' (' + h.part + ')'), ids: hits.map(h => h.model.id) };
  });
  const unknown = rows.filter(r => !r.ids.length);
  // Hộp A2190 dùng chung Pro 1; A1602/A1938 dùng chung AirPods 1/2.
  let common = null;
  rows.forEach(r => { if (!r.ids.length) return; common = common === null ? r.ids.slice() : common.filter(id => r.ids.indexOf(id) >= 0); });
  let verdict;
  if (unknown.length) verdict = { tone: 'stop', text: 'Có số không thuộc AirPods nào trong danh sách: ' + unknown.map(u => u.value).join(', ') + '. Kiểm tra lại cách đọc, nếu đúng thì nghi hàng giả.' };
  else if (common && common.length) verdict = { tone: 'pass', text: 'Cùng một đời: ' + HEADPHONE_MODELS.filter(m => common.indexOf(m.id) >= 0).map(m => m.name).join(' / ') + '.' };
  else verdict = { tone: 'warn', text: 'Các bộ phận thuộc các đời khác nhau: có tai hoặc hộp đã thay.' };
  return { rows, verdict, ids: common || [] };
}

// ---------- Kích thước màn hình iPhone (để đối chiếu khi mở app trên chính máy đang kiểm) ----------
function iphonesByScreen(w, h, dpr) {
  const a = Math.min(w, h), b = Math.max(w, h);
  return PHONE_MODELS.filter(m => m.screen && m.screen[0] === a && m.screen[1] === b && Math.abs(m.screen[2] - dpr) < 0.01).map(m => m.name);
}

// ---------- EXIF / MakerNote máy ảnh ----------
// Đọc trực tiếp từ JPEG gốc: hãng, đời máy, số sê-ri, số lần chụp (Nikon, Canon R5/R6/R6 II/R8/R50,
// Sony, Pentax, Fujifilm). Cách đọc dựa trên mã nguồn ExifTool 13.59.

const SONY_DECIPHER = (function () {
  const t = new Uint8Array(256);
  for (let b = 0; b < 256; b++) t[b] = b;
  for (let b = 0; b < 249; b++) t[(b * b * b) % 249] = b;
  return t;
})();

const EXIF_MODEL_MAP = [
  [/EOS R50$/i, 'c-r50'], [/EOS R10$/i, 'c-r10'], [/EOS R8$/i, 'c-r8'], [/EOS R7$/i, 'c-r7'], [/EOS RP$/i, 'c-rp'], [/EOS R$/i, 'c-r'],
  [/EOS R6m2$/i, 'c-r6ii'], [/EOS R6$/i, 'c-r6'], [/EOS R5$/i, 'c-r5'], [/EOS M50m2$/i, 'c-m50ii'], [/EOS 90D$/i, 'c-90d'],
  [/EOS (850D|Rebel T8i|Kiss X10i)$/i, 'c-850d'], [/EOS 6D Mark II$/i, 'c-6dii'],
  [/^ILCE-7M3/i, 's-a7iii'], [/^ILCE-7M4/i, 's-a7iv'], [/^ILCE-7CM2/i, 's-a7cii'], [/^ILCE-7C$/i, 's-a7c'], [/^ILCE-6400/i, 's-a6400'],
  [/^ILCE-6600/i, 's-a6600'], [/^ILCE-6700/i, 's-a6700'], [/^ZV-E10$/i, 's-zve10'],
  [/Z ?5$/i, 'n-z5'], [/Z ?6_?2|Z ?6 ?II$/i, 'n-z6ii'], [/Z ?6_?3|Z ?6 ?III$/i, 'n-z6iii'], [/Z ?50$/i, 'n-z50'], [/Z ?fc$/i, 'n-zfc'], [/Z ?f$/i, 'n-zf'],
  [/D750$/i, 'n-d750'], [/D7500$/i, 'n-d7500'], [/D850$/i, 'n-d850'],
  [/X-T30 ?II/i, 'f-xt30ii'], [/X-S10/i, 'f-xs10'], [/X-S20/i, 'f-xs20'], [/X-T4/i, 'f-xt4'], [/X-T5/i, 'f-xt5'], [/X100VI/i, 'f-x100vi'], [/X100V$/i, 'f-x100v']
];

function matchCameraModel(model) {
  if (!model) return null;
  for (const [re, id] of EXIF_MODEL_MAP) if (re.test(model.trim())) return id;
  return null;
}

function parseCameraJpeg(buf) {
  const u8 = new Uint8Array(buf);
  const dv = new DataView(buf);
  const N = u8.length;
  const out = { notes: [] };
  const ascii = (o, n) => { let s = ''; for (let i = 0; i < n && o + i < N; i++) s += String.fromCharCode(u8[o + i]); return s; };
  if (N < 4 || u8[0] !== 0xFF || u8[1] !== 0xD8) return { error: 'Không phải ảnh JPEG.' };

  // Tìm APP1 Exif
  let off = 2, t0 = -1;
  while (off + 4 <= N) {
    if (u8[off] !== 0xFF) { off++; continue; }
    const mk = u8[off + 1];
    if (mk === 0xFF) { off++; continue; }
    if (mk === 0xD8 || mk === 0x01 || (mk >= 0xD0 && mk <= 0xD7)) { off += 2; continue; }
    if (mk === 0xDA || mk === 0xD9) break;
    const len = dv.getUint16(off + 2);
    if (mk === 0xE1 && ascii(off + 4, 6) === 'Exif\0\0') { t0 = off + 10; break; }
    off += 2 + len;
  }
  if (t0 < 0) return { error: 'Ảnh không còn thông tin EXIF. Ảnh gửi qua Zalo, Messenger, Telegram (dạng ảnh) thường bị xoá thông tin: cần file gốc.' };

  const u16 = (o, le) => (o + 2 <= N ? dv.getUint16(o, le) : 0);
  const u32 = (o, le) => (o + 4 <= N ? dv.getUint32(o, le) : 0);
  const SZ = { 1: 1, 2: 1, 3: 2, 4: 4, 5: 8, 6: 1, 7: 1, 8: 2, 9: 4, 10: 8, 11: 4, 12: 8, 13: 4 };
  function readIFD(at, base, le) {
    const map = {};
    if (at < 0 || at + 2 > N) return map;
    const cnt = u16(at, le);
    if (cnt === 0 || cnt > 512) return map;
    for (let i = 0; i < cnt; i++) {
      const e = at + 2 + i * 12;
      if (e + 12 > N) break;
      const tag = u16(e, le), type = u16(e + 2, le), count = u32(e + 4, le);
      const size = (SZ[type] || 1) * count;
      const pos = size <= 4 ? e + 8 : base + u32(e + 8, le);
      if (pos < 0 || pos + Math.min(size, 4) > N) continue;
      map[tag] = { type, count, size, pos };
    }
    return map;
  }
  const str = (e) => { if (!e) return ''; let s = ''; for (let i = 0; i < e.size && e.pos + i < N; i++) { const c = u8[e.pos + i]; if (c === 0) break; s += String.fromCharCode(c); } return s.trim(); };
  const num = (e, le) => !e ? null : e.type === 3 ? u16(e.pos, le) : e.type === 4 || e.type === 9 ? u32(e.pos, le) : e.type === 1 || e.type === 7 ? u8[e.pos] : null;
  const rat = (e, le) => { if (!e || e.type !== 5) return null; const a = u32(e.pos, le), b = u32(e.pos + 4, le); return b ? a / b : null; };

  const bo = ascii(t0, 2);
  if (bo !== 'II' && bo !== 'MM') return { error: 'EXIF hỏng.' };
  const le = bo === 'II';
  const ifd0 = readIFD(t0 + u32(t0 + 4, le), t0, le);
  out.make = str(ifd0[0x010F]);
  out.model = str(ifd0[0x0110]);
  out.software = str(ifd0[0x0131]);
  const exifPtr = ifd0[0x8769] ? u32(ifd0[0x8769].pos, le) : 0;
  const exif = exifPtr ? readIFD(t0 + exifPtr, t0, le) : {};
  out.date = str(exif[0x9003]) || str(ifd0[0x0132]);
  out.iso = num(exif[0x8827], le);
  out.exposure = rat(exif[0x829A], le);
  out.fnumber = rat(exif[0x829D], le);
  out.bodySerial = str(exif[0xA431]);
  out.lens = str(exif[0xA434]);
  out.lensSerial = str(exif[0xA435]);
  out.catalogId = matchCameraModel(out.model);

  const mn = exif[0x927C];
  const make = out.make.toUpperCase();
  const shutter = (value, kind, src) => { out.shutter = { value, kind, src }; };
  if (!mn) { out.notes.push('Không có MakerNote (thông tin riêng của hãng), nên không đọc được số lần chụp.'); return out; }
  const m0 = mn.pos;

  try {
    if (/^NIKON/.test(make)) {
      out.brand = 'nikon';
      if (ascii(m0, 7) === 'Nikon\0\x02') {
        const tb = m0 + 10, le2 = ascii(tb, 2) === 'II';
        const ifd = readIFD(tb + u32(tb + 4, le2), tb, le2);
        out.makerSerial = str(ifd[0x001D]) || str(ifd[0x00A0]).replace(/^NO=\s*/, '');
        const sc = ifd[0x00A7] ? u32(ifd[0x00A7].pos, le2) : null;
        if (sc != null && sc !== 0xFFFFF7FF) shutter(sc, 'total', 'Nikon 0x00A7');
        const mech = ifd[0x0037] ? u32(ifd[0x0037].pos, le2) : null;
        if (mech != null && mech > 0 && mech !== 0xFFFFF7FF) out.mechCount = mech;
      } else out.notes.push('MakerNote Nikon đời cũ, không có số lần chụp.');
    } else if (/^CANON/.test(make)) {
      out.brand = 'canon';
      const ifd = readIFD(m0, t0, le);
      if (ifd[0x000C]) out.makerSerial = String(u32(ifd[0x000C].pos, le)).padStart(10, '0');
      const ci = ifd[0x000D];
      let o = null;
      if (/\bEOS R[56]$/.test(out.model)) o = 0x0AF1;
      else if (/\bEOS (R6m2|R8|R50)$/.test(out.model)) o = 0x0D29;
      if (ci && o != null) {
        if (ci.size >= o + 4 && ci.pos + o + 4 <= N) shutter(u32(ci.pos + o, le), 'total', 'Canon CameraInfo');
        else out.notes.push('Khối CameraInfo ngắn bất thường, không đọc được.');
      } else out.notes.push('App chưa đọc được số lần chụp của đời Canon này từ ảnh (chỉ R5, R6, R6 II, R8, R50).');
    } else if (/^SONY/.test(make)) {
      out.brand = 'sony';
      const start = /^(SONY (DSC|CAM|MOBILE)|\0\0SONY PIC\0|VHAB {5}\0)/.test(ascii(m0, 12)) ? m0 + 12 : m0;
      let le2 = le, cnt = u16(start, le2);
      if (cnt === 0 || cnt > 300) { le2 = !le; cnt = u16(start, le2); }
      const ifd = readIFD(start, t0, le2);
      const e = ifd[0x9050];
      if (e && e.size >= 0x40) {
        const raw = u8.subarray(e.pos, Math.min(N, e.pos + e.size));
        const d = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) d[i] = SONY_DECIPHER[raw[i]];
        const rd = o => (d[o] | (d[o + 1] << 8) | (d[o + 2] << 16) | (d[o + 3] << 24)) >>> 0;
        const M = out.model;
        const zero5 = raw[0] === 0 && raw[1] === 0 && raw[2] === 0 && raw[3] === 0 && raw[4] === 0;
        if (/^(ILCE-(6700|7CM2|7CR)|ILME-FX2)\b/.test(M) || (/^ILCE-(1M2|7M5|7RM6)/.test(M) && zero5)) {
          shutter(rd(0x0A) & 0xFFFFFF, 'mech', 'Sony 9050d');
        } else if (/^ZV-(E1|E10M2)\b/.test(M)) {
          out.notes.push('Đời máy này không có số đếm màn trập trong ảnh.');
        } else if (/^ILCE-(1M2|7M5|7RM6)/.test(M)) {
          out.notes.push('Máy này chỉ ghi số lần chụp khi chụp bằng màn trập cơ. Chụp lại tấm thử với màn trập cơ.');
        } else if (/^(ILCE-(6100A?|6300|6400A?|6500|6600|7C|7M3|7RM2|7RM3A?|7RM4A?|7SM2|9|9M2)|ILCA-99M2|ZV-E10)\b/.test(M) ||
                   /^(ILCE-(1\b|7M4|7RM5|7SM3)|ILME-FX3)/.test(M)) {
          shutter(rd(0x3A) & 0xFFFFFF, 'total', 'Sony 9050b/c');
        } else if (!/^(DSC-|Stellar|ILCE-(1|6100|6300|6400|6500|6600|6700|7C|7M3|7M4|7M5|7RM2|7RM3A?|7RM4A?|7RM5|7RM6|7SM2|7SM3|9|9M2)|ILCA-99M2|ILME-(FX2|FX3)|ZV-)/.test(M)) {
          shutter(rd(0x32) & 0xFFFFFF, 'total', 'Sony 9050a');
          out.notes.push('Một số đời Sony cũ quay vòng về 0 sau 65.536 lần.');
        }
      } else out.notes.push('Không thấy khối dữ liệu 0x9050 của Sony.');
      if (!out.bodySerial) out.notes.push('Sony chỉ ghi số sê-ri khi bật Ghi số sê-ri trong menu Tệp.');
    } else if (/^FUJIFILM/.test(make) || ascii(m0, 8) === 'FUJIFILM') {
      out.brand = 'fujifilm';
      const ifd = readIFD(m0 + u32(m0 + 8, true), m0, true);
      out.makerSerial = str(ifd[0x0010]);
      if (ifd[0x1438]) shutter(u16(ifd[0x1438].pos, true) & 0x7FFF, 'images', 'Fujifilm ImageCount');
      else out.notes.push('Đời máy này không ghi số ảnh.');
    } else if (/^(PENTAX|RICOH|ASAHI)/.test(make)) {
      out.brand = 'pentax';
      let start = m0, le2 = le, base = m0;
      if (ascii(m0, 4) === 'AOC\0') { const b2 = ascii(m0 + 4, 2); if (b2 === 'MM') le2 = false; else if (b2 === 'II') le2 = true; start = m0 + 6; }
      else if (ascii(m0, 8) === 'PENTAX \0') { const b2 = ascii(m0 + 8, 2); le2 = b2 === 'II'; start = m0 + 10; base = m0; }
      let cnt = u16(start, le2);
      if (cnt === 0 || cnt > 300) le2 = !le2;
      const ifd = readIFD(start, base, le2);
      const sc = ifd[0x005D], dt = ifd[0x0006], tm = ifd[0x0007];
      if (sc && dt && tm && sc.size === 4 && dt.size >= 4 && tm.size >= 3) {
        const be = o => ((u8[o] << 24) | (u8[o + 1] << 16) | (u8[o + 2] << 8) | u8[o + 3]) >>> 0;
        const raw = be(sc.pos), date = be(dt.pos);
        const time = ((u8[tm.pos] << 24) | (u8[tm.pos + 1] << 16) | (u8[tm.pos + 2] << 8)) >>> 0;
        shutter(((raw ^ date ^ ((0xFFFFFFFF - time) >>> 0)) >>> 0), 'total', 'Pentax 0x005D');
        out.notes.push('Pentax không đếm lần chụp Live View và quay phim; số có thể bị đặt lại khi bảo dưỡng.');
      }
      for (const b of [base, t0]) {
        const e = readIFD(start, b, le2)[0x0229];
        const s = str(e);
        if (s && /^[\x20-\x7E]+$/.test(s)) { out.makerSerial = s; break; }
      }
    } else if (/^(OLYMPUS|OM DIGITAL)/.test(make)) {
      out.brand = 'olympus'; out.notes.push(SC_HOWTO.olympus);
    } else if (/^PANASONIC/.test(make)) {
      out.brand = 'panasonic'; out.notes.push(SC_HOWTO.panasonic);
    }
  } catch (err) {
    out.notes.push('Lỗi khi đọc MakerNote: ' + err.message);
  }
  return out;
}

// ===== Pin Galaxy từ nhật ký *#9900# (dumpstate) =====
// Samsung không hiện % pin trên nhiều bản phần mềm, nhưng tệp dumpState_….zip có ghi:
// BatteryInfoBackUp › mSavedBatteryAsoc / mSavedBatteryBsoh (độ khoẻ %), battery_cycle (vòng sạc cộng dồn),
// batteryFullCharge (dung lượng thiết kế, µAh). Phần dưới đây không dùng DOM để kiểm thử được trong Node.

// Tìm mục dumpstate*.txt lớn nhất trong tệp ZIP. read(start, end) → Promise<DataView>.
async function findZipEntry(size, read, want) {
  const re = want || /^dumpstate.*\.txt$/i;
  const tailLen = Math.min(size, 65557);
  const tail = await read(size - tailLen, size);
  let eocd = -1;
  for (let i = tail.byteLength - 22; i >= 0; i--) { if (tail.getUint32(i, true) === 0x06054b50) { eocd = i; break; } }
  if (eocd < 0) throw new Error('Tệp nén bị hỏng hoặc chưa chép xong. Chép lại tệp rồi thử lần nữa.');
  let cdSize = tail.getUint32(eocd + 12, true), cdOff = tail.getUint32(eocd + 16, true);
  if (cdOff === 0xFFFFFFFF || cdSize === 0xFFFFFFFF) {
    const loc = eocd - 20;
    if (loc >= 0 && tail.getUint32(loc, true) === 0x07064b50) {
      const off = Number(tail.getBigUint64(loc + 8, true));
      const z = await read(off, off + 56);
      cdSize = Number(z.getBigUint64(40, true)); cdOff = Number(z.getBigUint64(48, true));
    }
  }
  const cd = await read(cdOff, cdOff + cdSize);
  let p = 0, best = null;
  while (p + 46 <= cd.byteLength && cd.getUint32(p, true) === 0x02014b50) {
    const method = cd.getUint16(p + 10, true);
    let csize = cd.getUint32(p + 20, true), usize = cd.getUint32(p + 24, true), lho = cd.getUint32(p + 42, true);
    const nlen = cd.getUint16(p + 28, true), xlen = cd.getUint16(p + 30, true), clen = cd.getUint16(p + 32, true);
    let name = '';
    for (let k = 0; k < nlen; k++) name += String.fromCharCode(cd.getUint8(p + 46 + k));
    let x = p + 46 + nlen;
    const xend = x + xlen;
    while (x + 4 <= xend) {
      const id = cd.getUint16(x, true), sz = cd.getUint16(x + 2, true);
      if (id === 1) {
        let q = x + 4;
        if (usize === 0xFFFFFFFF) { usize = Number(cd.getBigUint64(q, true)); q += 8; }
        if (csize === 0xFFFFFFFF) { csize = Number(cd.getBigUint64(q, true)); q += 8; }
        if (lho === 0xFFFFFFFF) { lho = Number(cd.getBigUint64(q, true)); q += 8; }
      }
      x += 4 + sz;
    }
    if (re.test(name.split('/').pop()) && (!best || usize > best.usize)) best = { name, method, csize, usize, lho };
    p += 46 + nlen + xlen + clen;
  }
  return best;
}
// Vị trí bắt đầu dữ liệu nén của một mục (sau tiêu đề cục bộ).
async function zipDataStart(read, e) {
  const lh = await read(e.lho, e.lho + 30);
  if (lh.getUint32(0, true) !== 0x04034b50) throw new Error('Không đọc được tệp nhật ký trong gói nén.');
  return e.lho + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
}

const GB_PATS = {
  bsoh: /mSavedBatteryBsoh\s*[:=]\s*(\d{1,3})\b/,
  asoc: /mSavedBatteryAsoc\s*[:=]\s*(\d{1,3})\b/,
  usage: /mSavedBatteryUsage\s*[:=]\s*(\d+)/,
  maxTemp: /mSavedBatteryMaxTemp\s*[:=]\s*(-?\d+)/,
  model: /\[ro\.product\.model\]:\s*\[([^\]\s]+)\]/,
  pda: /\[ro\.build\.PDA\]:\s*\[([^\]\s]+)\]/,
  design: /batteryFullCharge(?:DesignCapacityUah)?\s*=\s*(\d{6,8})/
};
const GB_CYCLE = /(?:battery_cycle:\s*|BATTERY_CYCLE\()(\d{1,6})/g;

// Dò từng đoạn chữ (đã giải nén). push() trả true khi đã đủ thông tin để dừng sớm.
function galaxyBattScanner() {
  const found = {}, lines = {};
  let cycle = null, tail = '', after = -1;
  const around = (buf, i, n) => buf.slice(Math.max(0, i - 120), Math.min(buf.length, i + n + 160)).replace(/\s+/g, ' ').trim();
  return {
    push(text) {
      const buf = tail + text;
      for (const k in GB_PATS) {
        if (found[k] != null) continue;
        const m = GB_PATS[k].exec(buf);
        if (m) { found[k] = m[1]; lines[k] = around(buf, m.index, m[0].length); }
      }
      GB_CYCLE.lastIndex = 0;
      let m;
      while ((m = GB_CYCLE.exec(buf))) {
        const v = +m[1];
        if (cycle == null || v > cycle) { cycle = v; lines.cycle = around(buf, m.index, m[0].length); }
      }
      tail = buf.slice(-400);
      const core = (found.bsoh != null || found.asoc != null) && (cycle != null || found.usage != null) && found.model != null;
      if (!core) return false;
      if (found.design != null) return true;
      // Đủ thông tin chính nhưng chưa thấy dung lượng thiết kế: đọc thêm khoảng 30 triệu ký tự rồi dừng.
      if (after < 0) after = 0;
      after += text.length;
      return after > 3e7;
    },
    result() { return galaxyBattSummary(found, cycle, lines); }
  };
}
function galaxyBattSummary(f, cycle, lines) {
  const n = k => (f[k] != null ? +f[k] : null);
  const bsoh = n('bsoh'), asoc = n('asoc');
  const health = bsoh != null ? bsoh : asoc;
  const design = f.design != null ? Math.round(+f.design / 1000) : null;
  return {
    health, src: bsoh != null ? 'bsoh' : asoc != null ? 'asoc' : null, bsoh, asoc,
    cycles: cycle != null ? cycle : f.usage != null ? Math.round(+f.usage / 100) : null,
    maxTempC: f.maxTemp != null ? +f.maxTemp / 10 : null,
    designMah: design, remainMah: design && health != null ? Math.round(design * health / 1000) * 10 : null,
    model: f.model || null, pda: f.pda || null,
    level: health == null ? null : health >= 90 ? 'ok' : health >= 85 ? 'b85' : health >= 80 ? 'b80' : 'low',
    lines: lines || {}
  };
}

// ===== Lõi tính toán: ngữ cảnh, chấm điểm, định giá, kết luận =====
// Không đụng tới DOM, chạy được trong Node để kiểm thử.

const AXIS_BY_GROUP = { lock: 'gate', id: 'info', body: 'cos', acc: 'extra' };
const FAULT_CAP = 69;         // có lỗi chức năng → tối đa hạng Khá (như DiagnoTest)
const COVERAGE_MIN = 0.8;     // kiểm dưới 80% → hạng tạm tính, không lên hai hạng cao nhất
const PROVISIONAL_CAP = 84;
const FLOOR_SHARE = 0.15;     // giá sàn = giá trị linh kiện, ~15% giá tham chiếu

function getCategory(id) { return CATEGORIES.find(c => c.id === id) || null; }
function getModel(cat, id) { return cat && id ? cat.models.find(m => m.id === id) || null : null; }

function newInspection(catId, modelId) {
  const now = Date.now();
  return {
    id: 'k' + now.toString(36) + Math.random().toString(36).slice(2, 6),
    cat: catId, model: modelId || '', created: now, updated: now,
    info: {}, inputs: {}, answers: {}, na: {}, notes: {}, costs: {}, tools: {}
  };
}

function buildContext(insp) {
  const cat = getCategory(insp.cat);
  const model = getModel(cat, insp.model);
  const info = insp.info || {};
  const part = cat && cat.id === 'phone' && model && model.brand === 'apple' ? decodeApplePartNo(info.partno) : null;
  const codes = cat && cat.id === 'phone' && model && model.brand !== 'apple' && (info.partno || info.code2) ? decodeCodes((info.partno || '') + ' ' + (info.code2 || '')) : null;
  return {
    cat, model, info, part, codes,
    inputs: insp.inputs || {},
    brand: model ? model.brand : (info.brand || 'other'),
    simExpect: cat && cat.id === 'phone' ? simExpectation(model, part) : null,
    hasLens: !!(info.hasLens || info.lens)
  };
}

// Văn bản trong dữ liệu có thể là chuỗi, hàm (theo ngữ cảnh) hoặc bảng theo hãng.
function textOf(v, c) {
  if (v == null) return '';
  if (typeof v === 'function') return v(c) || '';
  if (typeof v === 'object') return v[c.brand] || v.default || '';
  return v;
}

function applicableItems(cat, c) {
  return cat.items.filter(it => !it.when || it.when(c));
}

function ruleOf(item) {
  const r = MONEY[item.id] || {};
  return {
    axis: r.axis || (item.gate && item.g === 'lock' ? 'gate' : AXIS_BY_GROUP[item.g] || 'fn'),
    fix: r.fix || null,
    p: r.p != null ? r.p : 0,
    lv: r.lv || {}
  };
}

function levelOf(item, id) { return id ? item.levels.find(l => l.id === id) || null : null; }

function gradeOf(score) { return GRADES.find(g => score >= g.min) || GRADES[GRADES.length - 1]; }
function cosGradeOf(score) { return COS_GRADES.find(g => score >= g.min) || COS_GRADES[COS_GRADES.length - 1]; }

function interp(curve, x) {
  if (x <= curve[0][0]) return curve[0][1];
  for (let i = 1; i < curve.length; i++) {
    const [x1, y1] = curve[i];
    if (x <= x1) { const [x0, y0] = curve[i - 1]; return y0 + (y1 - y0) * (x - x0) / (x1 - x0); }
  }
  return curve[curve.length - 1][1];
}

// ---------- Chấm điểm ----------
function scoreInspection(insp) {
  const c = buildContext(insp);
  const cat = c.cat;
  const items = applicableItems(cat, c);
  const groupW = {};
  cat.groups.forEach(g => { groupW[g.id] = g.W; });

  // trọng số hiệu dụng: W nhóm chia đều theo w của các mục áp dụng trong nhóm
  const wsum = {};
  items.forEach(it => { if (!insp.na[it.id] && it.w) wsum[it.g] = (wsum[it.g] || 0) + it.w; });

  const rows = items.map(it => {
    const rule = ruleOf(it);
    const na = !!insp.na[it.id];
    const level = na ? null : levelOf(it, insp.answers[it.id]);
    const ew = !na && it.w && groupW[it.g] ? groupW[it.g] * it.w / wsum[it.g] : 0;
    const lvr = level ? (rule.lv[level.id] || {}) : {};
    const fault = !!level && rule.axis === 'fn' && level.f < 0.5 && lvr.fault !== false;
    return { item: it, rule, na, level, ew, fault, status: na ? 'na' : level ? 'done' : 'todo' };
  });

  let sw = 0, swf = 0, total = 0;
  const caps = [], ko = [], gatesPending = [];
  let cw = 0, cwf = 0, cosN = 0;
  const faults = [], wear = [];
  rows.forEach(r => {
    const it = r.item;
    if (!r.na) total += r.ew;
    if (r.level) {
      sw += r.ew; swf += r.ew * r.level.f;
      if (r.level.ko) ko.push({ item: it, level: r.level });
      if (r.level.cap != null) caps.push({ cap: r.level.cap, why: textOf(it.t, c) + ': ' + r.level.label });
      if (r.fault) faults.push(r);
      else if (r.rule.axis === 'fn' && r.level.f < 1) wear.push(r);
      if (r.rule.axis === 'cos' && it.w) { cw += it.w; cwf += it.w * r.level.f; cosN++; }
    } else if (!r.na && it.gate && !it.optional) {
      gatesPending.push(it);
    }
  });
  if (faults.length) caps.push({ cap: FAULT_CAP, why: 'Có lỗi chức năng (' + faults.map(f => textOf(f.item.t, c)).join(', ') + ')' });

  const coverage = total ? sw / total : 0;
  const provisional = coverage < COVERAGE_MIN;
  if (provisional && sw > 0) caps.push({ cap: PROVISIONAL_CAP, why: 'Mới kiểm ' + Math.round(coverage * 100) + '% khối lượng, hạng chỉ là tạm tính' });

  const raw = sw ? 100 * swf / sw : null;
  let score = raw;
  let capBy = null;
  if (raw != null) caps.forEach(k => { if (k.cap < score) { score = k.cap; capBy = k; } });
  if (score != null) score = Math.round(score * 10) / 10;

  const cosScore = cw ? 100 * cwf / cw : null;
  const todo = rows.filter(r => r.status === 'todo' && !r.item.optional);
  return {
    ctx: c, rows, raw, score, capBy, caps, ko, gatesPending,
    coverage, provisional,
    grade: score != null ? gradeOf(score) : null,
    cos: { score: cosScore, grade: cosScore != null ? cosGradeOf(cosScore) : null, n: cosN },
    faults, wear,
    counts: {
      total: rows.filter(r => !r.na && !r.item.optional).length,
      done: rows.filter(r => r.status === 'done' && !r.item.optional).length,
      todo: todo.length,
      gates: rows.filter(r => r.item.gate && !r.na && !r.item.optional).length,
      gatesDone: rows.filter(r => r.item.gate && r.level && !r.item.optional).length
    }
  };
}

// ---------- Tiền tệ ----------
function usdTo(cur, s) {
  return cur === 'USD' ? 1 : cur === 'RUB' ? s.usdRub : s.usdRub * s.rubVnd;
}
function convert(v, from, to, s) { return from === to ? v : v / usdTo(from, s) * usdTo(to, s); }

function roundTo(v, step, mode) {
  const f = mode === 'down' ? Math.floor : mode === 'up' ? Math.ceil : Math.round;
  return f(v / step) * step;
}

function fmtMoney(v, cur, locale) {
  if (v == null || !isFinite(v)) return '—';
  const C = CURRENCIES[cur];
  const n = Math.round(Math.abs(v)).toLocaleString(locale || C.locale);
  const s = C.after ? n + ' ' + C.symbol : C.symbol + n;
  return v < 0 ? '−' + s : s;
}

// Đọc một con số tiền gõ tự do: "15 000", "15k", "18tr", "18,5 triệu", "71к", "1.2 млн", "$450"
function parseMoney(text, defCur) {
  if (text == null) return null;
  let s = String(text).toLowerCase().replace(/ /g, ' ').trim();
  if (!s) return null;
  let cur = defCur;
  const W = '[^a-z0-9à-ỹа-яё]';
  if (new RegExp('₫|vnđ|vnd|đồng|triệu|(^|' + W + '|\\d)(đ|tr)(' + W + '|$)').test(s)) cur = 'VND';
  else if (new RegExp('₽|руб|rub|тыс|млн|(^|' + W + '|\\d)(р|к)\\.?(' + W + '|$)').test(s)) cur = 'RUB';
  else if (/\$|usd|\bđô\b/.test(s)) cur = 'USD';
  const m = s.match(/(\d[\d\s.,]*)\s*(k|к|тыс\.?|ngh[iì]n|tr|triệu|млн|m)?/);
  if (!m) return null;
  let num = m[1].replace(/\s/g, '');
  const mult = !m[2] ? 1 : /^(k|к|тыс|ngh)/.test(m[2]) ? 1e3 : 1e6;
  if (mult > 1) num = num.replace(',', '.');
  else if (/^\d{1,3}([.,]\d{3})+$/.test(num)) num = num.replace(/[.,]/g, '');
  else num = num.replace(',', '.');
  const v = parseFloat(num) * mult;
  return isFinite(v) && v > 0 ? { value: v, cur } : null;
}

function quantile(sorted, q) {
  if (!sorted.length) return null;
  const pos = (sorted.length - 1) * q, lo = Math.floor(pos), hi = Math.ceil(pos);
  return sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo);
}

// Tin rao tương đương: mỗi dòng một giá. Loại tin lệch xa trung vị quá 3·MAD.
function compStats(text, cur, s) {
  const lines = String(text || '').split(/\n|;/).map(x => x.trim()).filter(Boolean);
  const parsed = [];
  lines.forEach(line => {
    const p = parseMoney(line, cur);
    if (p) parsed.push({ line, value: convert(p.value, p.cur, cur, s), cur: p.cur, orig: p.value });
  });
  if (!parsed.length) return null;
  const vals = parsed.map(p => p.value).sort((a, b) => a - b);
  const med = quantile(vals, 0.5);
  const dev = vals.map(v => Math.abs(v - med)).sort((a, b) => a - b);
  const mad = quantile(dev, 0.5) * 1.4826;
  parsed.forEach(p => { p.out = mad > 0 && Math.abs(p.value - med) > 3 * mad; });
  const kept = parsed.filter(p => !p.out).map(p => p.value).sort((a, b) => a - b);
  return {
    items: parsed, n: kept.length,
    median: quantile(kept, 0.5), p25: quantile(kept, 0.25), p75: quantile(kept, 0.75),
    min: kept[0], max: kept[kept.length - 1]
  };
}

function modelAgeYears(m, now) {
  if (!m || !m.year) return null;
  const launch = new Date(m.year, 8, 20).getTime();
  return Math.max(0, ((now || Date.now()) - launch) / (365.25 * 864e5));
}

function referencePrice(insp, c, s) {
  const cur = s.currency;
  const comps = compStats(insp.info.comps, cur, s);
  const manual = parseMoney(insp.info.ref, cur);
  if (comps && comps.n >= 2) {
    return { value: comps.median * (1 - s.listingDiscount / 100), src: 'comps', comps,
      text: 'Trung vị ' + comps.n + ' tin rao, trừ ' + s.listingDiscount + '% chênh giá rao/giá chốt' };
  }
  if (manual) return { value: convert(manual.value, manual.cur, cur, s), src: 'manual', comps, text: 'Giá tham chiếu bạn nhập' };
  const m = c.model;
  if (m && m.usd) {
    const age = modelAgeYears(m);
    const keep = interp(RETENTION[c.cat.retention(m)], age);
    return { value: m.usd * keep * usdTo(cur, s), src: 'estimate', comps, age, keep,
      text: 'Ước tính thô: giá ra mắt ' + m.usd + ' USD × ' + Math.round(keep * 100) + '% sau ' + age.toFixed(1) + ' năm. Nên dán giá tin rao để chính xác hơn' };
  }
  return { value: null, src: 'none', comps, text: 'Chưa có giá tham chiếu: dán vài tin rao cùng model hoặc tự nhập' };
}

// Chi phí cơ sở của một kiểu sửa (trước khi nhân mức độ), theo tiền đang dùng.
function baseCost(fix, ctx, ref, s, partsUSD) {
  if (!fix) return null;
  if (typeof fix === 'function') fix = fix(ctx);
  const factor = s.repairFactor;
  if (typeof fix === 'string') {
    const u = partsUSD[fix];
    return u ? { value: u * factor * usdTo(s.currency, s), label: PART_NAMES[fix] || fix, part: fix } : null;
  }
  if (fix.usd) return { value: fix.usd * factor * usdTo(s.currency, s), label: 'chi phí sửa' };
  if (fix.pct) return ref ? { value: fix.pct * ref, label: Math.round(fix.pct * 100) + '% giá tham chiếu' } : null;
  if (fix.lens) {
    const lv = parseMoney(ctx.info.lensValue, s.currency);
    const base = lv ? convert(lv.value, lv.cur, s.currency, s) : (ref ? 0.25 * ref : null);
    return base ? { value: fix.lens * base, label: lv ? 'theo giá ống kính' : '25% giá tham chiếu (chưa nhập giá ống kính)' } : null;
  }
  return null;
}

// ---------- Định giá và kết luận ----------
function valuate(insp, s, sc) {
  sc = sc || scoreInspection(insp);
  const c = sc.ctx;
  const cur = s.currency;
  const ref = referencePrice(insp, c, s);
  const R0 = ref.value;
  const partsUSD = c.cat.repairUSD ? c.cat.repairUSD(c.model) : {};
  const K = sc.cos.score != null ? interp(COS_CURVE, sc.cos.score) : 1;
  const found = [], risk = [];

  sc.rows.forEach(r => {
    if (r.na) return;
    const it = r.item, rule = r.rule;
    const name = textOf(it.t, c);
    const override = insp.costs[it.id];
    if (r.level) {
      const lvr = rule.lv[r.level.id] || {};
      const rf = lvr.rf != null ? lvr.rf : (rule.axis === 'fn' ? 1 - r.level.f : 0);
      const fix = lvr.fix || rule.fix;
      let amount = 0, label = '';
      if (rf > 0) {
        const bc = override != null ? { value: override, label: 'bạn sửa' } : baseCost(fix, c, R0, s, partsUSD);
        if (bc) { amount += rf * bc.value; label = bc.label + (rf !== 1 ? ' × ' + Math.round(rf * 100) + '%' : ''); }
      }
      if (lvr.adj && R0) {
        amount -= lvr.adj * R0;
        label = (label ? label + '; ' : '') + (lvr.adj > 0 ? 'cộng ' : 'trừ ') + Math.round(Math.abs(lvr.adj) * 100) + '% giá';
      }
      if (Math.round(amount) !== 0) found.push({ id: it.id, name, level: r.level.label, amount, label, base: fix, rf });
    } else if (!it.gate && rule.axis === 'fn' && rule.p > 0) {
      const bc = override != null ? { value: override, label: 'bạn sửa' } : baseCost(rule.fix, c, R0, s, partsUSD);
      if (bc) risk.push({ id: it.id, name, amount: rule.p * bc.value, p: rule.p, cost: bc.value, label: Math.round(rule.p * 100) + '% khả năng lỗi × ' + bc.label });
    }
  });
  found.sort((a, b) => b.amount - a.amount);
  risk.sort((a, b) => b.amount - a.amount);
  const foundTotal = found.reduce((a, d) => a + d.amount, 0);
  const riskTotal = risk.reduce((a, d) => a + d.amount, 0);

  const C = CURRENCIES[cur];
  let fair = null, floorHit = false, base = null;
  if (R0) {
    base = R0 * K;
    fair = (base - foundTotal - riskTotal) * (1 - (s.margin || 0) / 100);
    if (fair < FLOOR_SHARE * R0) { fair = FLOOR_SHARE * R0; floorHit = true; }
    fair = roundTo(fair, C.step);
  }
  const fairBest = R0 ? roundTo(Math.max(FLOOR_SHARE * R0, base - foundTotal) * (1 - (s.margin || 0) / 100), C.step) : null;

  const askP = parseMoney(insp.info.ask, cur);
  const ask = askP ? convert(askP.value, askP.cur, cur, s) : null;

  let verdict = null, ratio = null;
  const reasons = [];
  if (sc.ko.length) {
    verdict = VERDICTS.stop;
    sc.ko.forEach(k => reasons.push(textOf(k.item.t, c) + ': ' + (k.level.note || k.level.label)));
  } else if (fair && ask) {
    ratio = ask / fair;
    const walkAt = 1 / s.closeRatio;
    verdict = ratio <= 0.92 ? VERDICTS.great : ratio <= 1.0 ? VERDICTS.buy : ratio <= walkAt ? VERDICTS.haggle : VERDICTS.walk;
  }
  const pending = !sc.ko.length && sc.gatesPending.length > 0;

  // Giá trả: mở đầu ở P25 tin rao (đã trừ lỗi), tối đa = giá hợp lý.
  let offers = null;
  if (fair && !sc.ko.length) {
    const max = roundTo(fair, C.step, 'down');
    let open = fair * 0.88;
    if (ref.comps && ref.comps.n >= 3) {
      const p25 = ref.comps.p25 * (1 - s.listingDiscount / 100) * K - foundTotal - riskTotal;
      if (p25 > 0) open = Math.min(open, p25);
    }
    open = Math.max(open, fair * 0.75);
    offers = { open: roundTo(open, C.bigStep, 'down'), max };
  }
  const cheap = R0 != null && R0 / usdTo(cur, s) < 40;
  const round = ask != null && ask >= 1000 && ask % (cur === 'VND' ? 1e6 : cur === 'RUB' ? 1000 : 50) === 0;

  return {
    cur, ref, K, base, found, risk, foundTotal, riskTotal, fair, fairBest, floorHit, ask, ratio,
    verdict, pending, reasons, offers, cheap, roundAsk: round, partsUSD
  };
}

// Ghi chú tự động từ số liệu nhập (pin so với chu kỳ, số chụp so với độ bền...).
function insights(insp, sc) {
  const c = sc.ctx, out = [];
  const inp = insp.inputs || {};
  if (c.cat.id === 'phone' && inp.battery) {
    const cyc = +inp.cycles || 0, bat = +inp.battery;
    if (cyc && c.model && c.brand === 'apple') {
      const life = c.model.cycles ? 1000 : 500;
      const expect = Math.max(70, 100 - cyc * 20 / life);
      if (bat > expect + 6 && cyc > 250) out.push({ tone: 'warn', text: 'Pin ' + bat + '% mà đã ' + cyc + ' chu kỳ: cao hơn mức thường gặp (~' + Math.round(expect) + '%). Có thể pin mới thay, xem mục Lịch sử linh kiện.' });
      else if (bat < expect - 6) out.push({ tone: 'warn', text: 'Pin chai nhanh hơn bình thường: ' + cyc + ' chu kỳ thường còn ~' + Math.round(expect) + '%, máy này ' + bat + '%.' });
      else out.push({ tone: 'pass', text: 'Pin ' + bat + '% với ' + cyc + ' chu kỳ là hợp lý (thường ~' + Math.round(expect) + '%).' });
    }
    const age = modelAgeYears(c.model);
    if (cyc && age != null && age > 0.2) {
      const perMonth = cyc / Math.max(1, (Date.now() - new Date(c.model.year, 8, 20)) / (30.44 * 864e5));
      if (perMonth > 40) out.push({ tone: 'warn', text: 'Khoảng ' + Math.round(perMonth) + ' chu kỳ mỗi tháng kể từ khi ra mắt: dùng rất nhiều (người thường ~20–30).' });
    }
  }
  if (c.cat.id === 'camera' && inp.shutter) {
    const r = ratedShutter(c.model), p = +inp.shutter / r.n;
    out.push({ tone: p < 0.7 ? 'pass' : 'warn', text: 'Đã dùng ' + Math.round(p * 100) + '% độ bền màn trập (' + (+inp.shutter).toLocaleString('vi-VN') + ' / ' + r.n.toLocaleString('vi-VN') + ', ' + (r.src === 'hãng' ? 'hãng công bố' : r.src === 'phụ' ? 'nguồn thứ cấp' : 'ước tính') + '). Dưới 70% thì số chụp gần như không ảnh hưởng giá.' });
  }
  if (c.cat.id === 'phone' && c.part && c.part.ok) {
    if (c.part.source.tone !== 'pass') out.push({ tone: c.part.source.tone === 'warn' ? 'warn' : 'info', text: 'Số máy bắt đầu bằng "' + c.part.first + '": ' + c.part.source.text + '.' + (c.part.source.note ? ' ' + c.part.source.note : '') });
    if (c.simExpect === 'none') out.push({ tone: 'info', text: 'Bản này chỉ dùng eSIM: không có khay SIM, nhà mạng của bạn phải hỗ trợ eSIM.' });
  }
  return out;
}

// Một dòng tóm tắt mã máy và thị trường cho báo cáo.
function codeSummary(c) {
  if (!c || !c.cat || c.cat.id !== 'phone') return '';
  const raw = c.model && c.model.brand === 'apple' ? (c.info.partno || '') : ((c.info.partno || '') + ' ' + (c.info.code2 || ''));
  const items = decodeCodes(raw).items.filter(x => x.ok);
  return items.map(x => x.code + ' (' + x.market.text + ')').join(', ');
}

// Báo cáo dạng chữ để gửi người bán / lưu lại.
function reportText(insp, s) {
  const sc = scoreInspection(insp), v = valuate(insp, s, sc), c = sc.ctx;
  const L = [];
  L.push('PHIẾU KIỂM ĐỒ CŨ — ' + (c.model ? c.model.name : c.cat.name) + (insp.info.storage ? ' ' + insp.info.storage : ''));
  L.push(new Date(insp.updated).toLocaleString('vi-VN'));
  const mk = codeSummary(c);
  if (mk) L.push('Mã máy: ' + mk);
  if (sc.score != null) L.push('Điểm: ' + Math.round(sc.score) + '/100 · ' + sc.grade.name + (sc.provisional ? ' (tạm tính)' : '') + ' · đã kiểm ' + sc.counts.done + '/' + sc.counts.total + ' mục');
  if (sc.cos.grade) L.push('Ngoại hình: ' + sc.cos.grade.id + ' (' + sc.cos.grade.name + ') · Chức năng: ' + (sc.faults.length ? sc.faults.length + ' lỗi' : 'chưa thấy lỗi'));
  if (v.verdict) L.push('Kết luận: ' + v.verdict.stamp.toUpperCase() + (v.reasons.length ? ' — ' + v.reasons.join('; ') : ''));
  if (v.fair && !sc.ko.length) L.push('Giá hợp lý: ' + fmtMoney(v.fair, v.cur) + (v.ask ? ' · Người bán đòi: ' + fmtMoney(v.ask, v.cur) : ''));
  if (v.offers) L.push('Trả giá: mở đầu ' + fmtMoney(v.offers.open, v.cur) + ', tối đa ' + fmtMoney(v.offers.max, v.cur));
  if (v.found.length) {
    L.push('Lỗi đã thấy:');
    v.found.forEach(d => L.push('  • ' + d.name + ' (' + d.level + '): ' + (d.amount >= 0 ? '−' : '+') + fmtMoney(Math.abs(d.amount), v.cur)));
  }
  const todo = sc.rows.filter(r => r.status === 'todo' && !r.item.optional);
  if (todo.length) L.push('Chưa kiểm: ' + todo.map(r => textOf(r.item.t, c)).join(', '));
  L.push('Giá tham chiếu: ' + (v.ref.value ? fmtMoney(v.ref.value, v.cur) : '—') + ' (' + v.ref.text + ')');
  return L.join('\n');
}

const live = { stream: null, ctx: null, nodes: [], timers: [], rec: null, listeners: [] };
function stopLive() {
  live.nodes.forEach(n => { try { n.stop ? n.stop() : null; } catch (e) {} try { n.disconnect(); } catch (e) {} });
  live.nodes = [];
  live.timers.forEach(t => clearTimeout(t)); live.timers = [];
  if (live.stream) { live.stream.getTracks().forEach(t => t.stop()); live.stream = null; }
  if (live.rec && live.rec.state !== 'inactive') { try { live.rec.stop(); } catch (e) {} }
  live.listeners.forEach(([t, ev, fn]) => t.removeEventListener(ev, fn)); live.listeners = [];
  document.querySelectorAll('.fill, .touchgrid').forEach(el => el.remove());
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
}
function listen(t, ev, fn, opt) { t.addEventListener(ev, fn, opt); live.listeners.push([t, ev, fn]); }
function audioCtx() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!live.ctx || live.ctx.state === 'closed') live.ctx = new AC();
  if (live.ctx.state === 'suspended') live.ctx.resume();
  return live.ctx;
}
function blockedMsg(err, what) {
  const name = err && err.name;
  if (name === 'NotAllowedError' || name === 'SecurityError') return 'Trình duyệt không cho dùng ' + what + '. Nếu đang mở trong Claude, hãy mở bản web (GitHub Pages) trên điện thoại; nếu đã từ chối quyền, bật lại trong cài đặt trang.';
  if (name === 'NotFoundError') return 'Không tìm thấy ' + what + ' trên máy này.';
  return 'Không mở được ' + what + (err && err.message ? ': ' + err.message : '') + '.';
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

TOOLS.touch = (el, api) => {
  el.innerHTML = '<p class="how">Màn hình chia thành các ô. Kéo ngón tay tô kín mọi ô, kể cả sát mép và bốn góc. Ô nào không đổi màu dù đã kéo qua nhiều lần là vùng cảm ứng chết.</p>' +
    '<div class="btnrow"><button class="btn primary" id="t-go">Bắt đầu</button></div><div id="t-res"></div><div id="t-after" hidden>' + levelPicker(api) + '</div>';
  el.querySelector('#t-go').onclick = () => {
    const size = 46, cols = Math.max(5, Math.floor(innerWidth / size)), rows = Math.max(8, Math.floor(innerHeight / size));
    const g = document.createElement('div');
    g.className = 'touchgrid';
    g.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
    g.style.gridTemplateRows = 'repeat(' + rows + ', 1fr)';
    let html = '';
    for (let k = 0; k < cols * rows; k++) html += '<i></i>';
    g.innerHTML = html + '<span class="cap">Còn ' + cols * rows + ' ô</span><button class="iconbtn x" aria-label="Dừng"><svg class="ico"><use href="#i-x"/></svg></button>';
    const cells = g.querySelectorAll('i'), cap = g.querySelector('.cap');
    let left = cells.length;
    const finish = (all) => {
      g.remove();
      el.querySelector('#t-res').innerHTML = '<div class="note ' + (all ? 'tone-pass">Mọi ô đều ăn cảm ứng.' : 'tone-warn">Dừng khi còn ' + left + ' ô chưa tô. Nếu đã kéo qua mà ô không đổi màu thì cảm ứng có vùng chết.') + '</div>';
      el.querySelector('#t-after').hidden = false; bindPicker(el, api);
    };
    const hit = (x, y) => {
      const t = document.elementFromPoint(x, y);
      if (t && t.parentNode === g && t.tagName === 'I' && !t.classList.contains('on')) {
        t.classList.add('on'); left--; cap.textContent = left ? 'Còn ' + left + ' ô' : 'Đủ mọi ô';
        if (!left) setTimeout(() => finish(true), 400);

    };
    g.addEventListener('pointerdown', e => { e.preventDefault(); hit(e.clientX, e.clientY); });
    g.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'touch') hit(e.clientX, e.clientY); });
    g.querySelector('.x').addEventListener('click', () => finish(false));
    document.body.appendChild(g);
  };
};

// ---------- Âm thanh ----------
function beep(ac, freq, pan, t0, dur, type) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.5, t0 + 0.02); g.gain.setValueAtTime(0.5, t0 + dur - 0.05); g.gain.linearRampToValueAtTime(0, t0 + dur);
  let out = g;
  if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = pan; g.connect(p); out = p; }
  o.connect(g); out.connect(ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
  live.nodes.push(o);
}
function audioTool(el, api, mode) {

      let got = 0, paint = 0;

        const { value, done } = await rd.read();

        if (Date.now() - paint > 120) { paint = Date.now(); bar.style.width = Math.min(100, got / total * 100) + '%'; st.textContent = 'Đang đọc… ' + Math.round(got / 1e6) + ' MB'; }

    }
    e.target.value = '';
  };
};

// ---------- Độ chai pin tai nghe ----------
function drainCalc(hours, minutes, l0, l1, r0, r1) {
  const exp = minutes / (hours * 60) * 100;
  const side = (a, b) => { if (a == null || b == null || isNaN(a) || isNaN(b)) return null; const d = a - b; return d > 0 ? { drop: d, health: Math.min(1.2, exp / d) } : { drop: d, health: null }; };
  const L = side(l0, l1), R = side(r0, r1);
  const hs = [L, R].filter(x => x && x.health != null).map(x => x.health);
  if (!hs.length) return { exp, L, R, level: null };
  const worst = Math.min(...hs);
  let level = worst >= 0.8 ? 'ok' : worst >= 0.6 ? 'mid' : 'low';
  if (L && R && L.drop > 0 && R.drop > 0 && Math.max(L.drop, R.drop) / Math.min(L.drop, R.drop) >= 1.5 && level !== 'low') level = 'uneven';
  return { exp, L, R, worst, level };
}

async function loadBitmap(file) {
  if (window.createImageBitmap) { try { return await createImageBitmap(file); } catch (e) {} }
  return await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('không giải mã được ảnh')); im.src = URL.createObjectURL(file); });
}

function findDust(gray, W, H) {
  const r = Math.max(8, Math.round(Math.max(W, H) / 45));
  const I = new Float64Array((W + 1) * (H + 1));
  for (let y = 0; y < H; y++) { let row = 0; for (let x = 0; x < W; x++) { row += gray[y * W + x]; I[(y + 1) * (W + 1) + x + 1] = I[y * (W + 1) + x + 1] + row; } }
  const box = (x, y) => {
    const x0 = Math.max(0, x - r), y0 = Math.max(0, y - r), x1 = Math.min(W, x + r + 1), y1 = Math.min(H, y + r + 1);
    return (I[y1 * (W + 1) + x1] - I[y0 * (W + 1) + x1] - I[y1 * (W + 1) + x0] + I[y0 * (W + 1) + x0]) / ((x1 - x0) * (y1 - y0));
  };
  const mask = new Uint8Array(W * H);
  let bright = 0;
  for (let y = r; y < H - r; y++) for (let x = r; x < W - r; x++) {
    const bg = box(x, y); bright += bg;
    if (bg - gray[y * W + x] > Math.max(4, bg * 0.03)) mask[y * W + x] = 1;
  }
  const meanBg = bright / Math.max(1, (W - 2 * r) * (H - 2 * r));
  const seen = new Uint8Array(W * H), spots = [], stack = [];
  const maxArea = W * H / 300;
  for (let i = 0; i < W * H; i++) {
    if (!mask[i] || seen[i]) continue;
    let n = 0, sx = 0, sy = 0, minx = W, maxx = 0, miny = H, maxy = 0;
    stack.push(i); seen[i] = 1;
    while (stack.length) {
      const j = stack.pop(), x = j % W, y = (j / W) | 0;
      n++; sx += x; sy += y; if (x < minx) minx = x; if (x > maxx) maxx = x; if (y < miny) miny = y; if (y > maxy) maxy = y;
      const nb = [j - 1, j + 1, j - W, j + W];
      for (const k of nb) if (k >= 0 && k < W * H && mask[k] && !seen[k] && Math.abs((k % W) - x) <= 1) { seen[k] = 1; stack.push(k); }
    }
    const w = maxx - minx + 1, h = maxy - miny + 1;
    if (n >= 5 && n <= maxArea && w / h < 4 && h / w < 4 && n / (w * h) > 0.3) spots.push({ x: sx / n, y: sy / n, rad: Math.max(w, h) / 2, n });
  }
  return { spots, meanBg, r };
}

function grayFrom(img, maxSide) {
  const W0 = img.width, H0 = img.height, s = Math.min(1, maxSide / Math.max(W0, H0));
  const W = Math.round(W0 * s), H = Math.round(H0 * s);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0, W, H);
  const d = g.getImageData(0, 0, W, H).data, gray = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) gray[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
  return { cv, g, gray, W, H };
}
